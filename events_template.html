<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>关键片段复核</title>
<style>
:root{
  --court:#1f4a3a; --court-ink:#e8efe9; --line:#c8312b;
  --paper:#f6f7f5; --ink:#1b211e; --quiet:#5d6862; --rule:#d9ddd9;
  --board:#141815; --amber:#ffb21e; --amber-dim:#5a4313;
  --digits:"DIN Condensed","DIN Alternate","Bahnschrift","Arial Narrow",sans-serif;
  --text:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 var(--text)}
header{background:var(--court);color:var(--court-ink);padding:14px 24px;display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}
header h1{font-size:20px;margin:0;font-weight:600}
header .meta{color:#b9cbbf;font-size:13px}
main{max-width:1280px;margin:0 auto;padding:20px 24px 48px;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
aside{position:sticky;top:16px;display:grid;gap:16px}
.board{background:var(--board);border-radius:10px;padding:16px 18px;color:#cfd6d1}
.board h2{margin:0 0 8px;font-size:15px;font-weight:500;color:#9aa69f}
.board table{width:100%;border-collapse:collapse}
.board th{font-weight:400;font-size:12px;color:#7d8a82;text-align:right;padding:0 0 4px}
.board th:first-child{text-align:left}
.board td{padding:6px 0;border-top:1px solid #262c28;text-align:right;font:600 28px/1 var(--digits);color:var(--amber);font-variant-numeric:tabular-nums}
.board td.zero{color:var(--amber-dim)}
.board td:first-child{text-align:left;font:15px/1.3 var(--text);color:#e6ebe7}
.board .empty{font:14px var(--text);color:#7d8a82;text-align:left}
.board .prog{margin-top:12px;padding-top:12px;border-top:1px solid #262c28;font-size:13px;color:#9aa69f}
.board .actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
button{font:inherit;font-size:14px;border-radius:6px;border:1px solid var(--rule);background:#fff;color:var(--ink);padding:6px 12px;cursor:pointer}
button.primary{background:var(--amber);border-color:var(--amber);color:#1b1305;font-weight:600}
.board button:not(.primary){background:transparent;color:#cfd6d1;border-color:#3a423d}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--court);outline-offset:2px}
.roster h2{font-size:15px;margin:0 0 4px}
.roster p{margin:0 0 8px;color:var(--quiet);font-size:13px}
textarea{width:100%;min-height:110px;font:15px/1.6 var(--text);padding:8px 10px;border:1px solid var(--rule);border-radius:6px;background:#fff}
.lead{margin:0 0 16px;color:var(--quiet);max-width:70ch}
.clip{background:#fff;border:1px solid var(--rule);border-radius:10px;padding:16px;margin-bottom:16px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
.clip.done{border-color:var(--court);box-shadow:inset 4px 0 0 var(--court)}
.clip h3{grid-column:1/-1;margin:0;font-size:16px;font-weight:600;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.clip h3 .id{font:600 24px/1 var(--digits);color:var(--quiet)}
.clip h3 .when{font-weight:400;color:var(--quiet);font-size:13px}
.tag{font-size:12px;font-weight:600;border-radius:4px;padding:1px 8px}
.tag.seen{background:#e3efe8;color:var(--court)}
.tag.todo{background:#fbeee0;color:#8a4b08}
video{width:100%;border-radius:6px;background:#000;display:block}
.note{font-size:14px;color:var(--ink);background:var(--paper);border-radius:6px;padding:8px 10px;margin:8px 0 0}
fieldset{border:0;margin:0 0 12px;padding:0}
legend{font-size:13px;color:var(--quiet);margin-bottom:4px;padding:0}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts label{border:1px solid var(--rule);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:14px;background:#fff}
.opts input{position:absolute;opacity:0;pointer-events:none}
.opts label:has(input:checked){background:var(--court);border-color:var(--court);color:#fff}
.opts label:has(input:focus-visible){outline:2px solid var(--court);outline-offset:2px}
select{font:inherit;width:100%;padding:6px 8px;border:1px solid var(--rule);border-radius:6px;background:#fff}
.confirm{display:flex;gap:8px;align-items:center;font-weight:600;margin-top:4px}
@media (max-width:900px){main{grid-template-columns:1fr}aside{position:static}.clip{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1 id="title">关键片段复核</h1><span class="meta" id="meta"></span></header>
<main>
  <div>
    <p class="lead">系统只切出了本队拿到球权和本队进攻的片段。看每个片段，勾选发生了什么、是谁，再点“已确认”。已经看清的结论已预先填好，核对一下即可。</p>
    <div id="clips"></div>
  </div>
  <aside>
    <div class="board" aria-label="本队数据">
      <h2>本队数据（只计已确认的片段）</h2>
      <table id="board"></table>
      <div class="prog" id="prog"></div>
      <div class="actions"><button class="primary" id="csv">导出 CSV</button><button id="json">导出复核结果</button></div>
    </div>
    <div class="roster">
      <h2>球员名单</h2>
      <p>每行一名球员，先写号码再写名字或特征，例如“7 张三”。不知道号码的可以只写特征。</p>
      <textarea id="roster" spellcheck="false" aria-label="球员名单"></textarea>
    </div>
  </aside>
</main>
<script src="data.js"></script>
<script>
const E = window.EVENTS, $ = id => document.getElementById(id);
const KEY = "hoopstats-events-v2:" + E.video;
let state = {roster: E.roster || "", clips: {}};
try { Object.assign(state, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch(e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e) {} };
const fmt = s => { s = Math.round(s); return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// 预填结论写入初始状态（只在没有人工改过时）
E.clips.forEach(c => {
  if (state.clips[c.id] || !c.prefill) return;
  const p = c.prefill, v = {};
  if (p.result) v.result = p.result;
  if (p.scorer) v.scorer = p.scorer;
  if (p.assist) v.assist = p.assist;
  if (p.how) v.how = p.how;
  if (p.who) v.who = p.who;
  if (p.confirmed) v.done = true;
  state.clips[c.id] = v;
});
$("title").textContent = E.title;
$("meta").textContent = `${E.video}，原视频 ${fmt(E.duration)}，需要看的片段共 ${fmt(E.covered)}`;

function players(){
  return state.roster.split("\n").map(l => l.trim()).filter(Boolean).map(l => {
    const m = l.match(/^#?(\d{1,3})\s*(.*)$/);
    return m ? {key:"p"+m[1], label:"#"+m[1]+(m[2]?" "+m[2]:"")} : {key:"n:"+l, label:l};
  });
}
function radios(name, opts, val){
  return `<div class="opts" role="radiogroup">${opts.map(([v,l]) =>
    `<label><input type="radio" name="${name}" value="${v}" ${val===v?"checked":""}>${l}</label>`).join("")}</div>`;
}
function pick(name, val, ps, none){
  return `<select data-f="${name}"><option value="">${none}</option>${ps.map(p =>
    `<option value="${esc(p.key)}" ${val===p.key?"selected":""}>${esc(p.label)}</option>`).join("")}</select>`;
}
function renderClips(){
  const ps = players(), box = $("clips");
  box.innerHTML = "";
  E.clips.forEach(c => {
    const v = state.clips[c.id] || {}, gain = c.kind === "gain";
    const el = document.createElement("section");
    el.className = "clip" + (v.done ? " done" : "");
    const seen = c.prefill && c.prefill.confirmed;
    el.innerHTML = `
      <h3><span class="id">${c.id}</span>${gain ? "本队拿到球权" : "本队进攻回合"}
        <span class="when">${fmt(c.start)} 到 ${fmt(c.end)}</span>
        <span class="tag ${seen ? "seen" : "todo"}">${seen ? "已有结论，请核对" : "待确认"}</span></h3>
      <div><video src="clips/${c.id}.mp4" controls preload="metadata" playsinline></video>
        ${c.prefill && c.prefill.note ? `<p class="note">${esc(c.prefill.note)}</p>` : ""}</div>
      <div>${gain ? `
        <fieldset><legend>怎么拿到球的</legend>${radios(c.id+"-how", [["dreb","防守篮板"],["stl","抢断"],["inb","对方得分后发球"],["other","其他"]], v.how)}</fieldset>
        <fieldset><legend>是谁</legend>${pick("who", v.who, ps, "看不清 / 不适用")}</fieldset>` : `
        <fieldset><legend>这个回合的结果</legend>${radios(c.id+"-result", [["2","2 分命中"],["3","3 分命中"],["ft","罚球"],["none","未得分 / 失误（不统计）"]], v.result)}</fieldset>
        ${v.result === "none" ? "" : `
        <fieldset><legend>得分者</legend>${pick("scorer", v.scorer, ps, "无 / 看不清")}</fieldset>
        ${v.result === "ft" ? `<fieldset><legend>罚球命中数</legend><select data-f="ftm">${[0,1,2,3].map(n=>`<option ${+(v.ftm||0)===n?"selected":""}>${n}</option>`).join("")}</select></fieldset>` : ""}
        <fieldset><legend>助攻</legend>${pick("assist", v.assist, ps, "无 / 看不清")}</fieldset>`}
        <fieldset><legend>进攻篮板（拿到前场篮板的人）</legend>${pick("oreb", v.oreb, ps, "无 / 看不清")}</fieldset>`}
        <label class="confirm"><input type="checkbox" data-f="done" ${v.done?"checked":""}> 已确认</label>
      </div>`;
    el.querySelectorAll("input[type=radio]").forEach(r => r.onchange = () => {
      const f = r.name.endsWith("-how") ? "how" : "result"; upd(c.id, f, r.value); });
    el.querySelectorAll("select").forEach(s => s.onchange = () => upd(c.id, s.dataset.f, s.value));
    el.querySelector("input[data-f=done]").onchange = e => { upd(c.id, "done", e.target.checked); };
    box.appendChild(el);
  });
}
function upd(id, f, val){ state.clips[id] = Object.assign(state.clips[id] || {}, {[f]: val}); save(); renderClips(); renderBoard(); }
function stats(){
  const S = {}, add = (k, f, n=1) => { if (!k) return; S[k] = S[k] || {pts:0, reb:0, ast:0, stl:0}; S[k][f] += n; };
  E.clips.forEach(c => {
    const v = state.clips[c.id]; if (!v || !v.done) return;
    if (c.kind === "gain") { if (v.how === "dreb") add(v.who, "reb"); if (v.how === "stl") add(v.who, "stl"); }
    else {
      if (v.result === "2") add(v.scorer, "pts", 2);
      if (v.result === "3") add(v.scorer, "pts", 3);
      if (v.result === "ft") add(v.scorer, "pts", +(v.ftm || 0));
      if (["2","3"].includes(v.result)) add(v.assist, "ast");
      add(v.oreb, "reb");
    }
  });
  return S;
}
function renderBoard(){
  const ps = players(), S = stats(), rows = ps.filter(p => S[p.key]);
  const cell = n => `<td class="${n?"":"zero"}">${n}</td>`;
  $("board").innerHTML = rows.length ? `<tr><th>球员</th><th>得分</th><th>篮板</th><th>助攻</th><th>抢断</th></tr>` +
    rows.map(p => { const s = S[p.key]; return `<tr><td>${esc(p.label)}</td>${cell(s.pts)}${cell(s.reb)}${cell(s.ast)}${cell(s.stl)}</tr>`; }).join("")
    : `<tr><td class="empty">确认片段后，这里会累计每名球员的数据。</td></tr>`;
  const done = E.clips.filter(c => (state.clips[c.id]||{}).done).length;
  $("prog").textContent = `已确认 ${done} / ${E.clips.length} 个片段`;
}
function download(name, text, type){
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], {type}));
  a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
$("csv").onclick = () => {
  const S = stats(), lines = ["球员,得分,篮板,助攻,抢断"];
  players().forEach(p => { const s = S[p.key]; if (s) lines.push([p.label, s.pts, s.reb, s.ast, s.stl].join(",")); });
  download(E.video.replace(/\.\w+$/,"") + "_本队数据.csv", "﻿" + lines.join("\n"), "text/csv");
};
$("json").onclick = () => download(E.video.replace(/\.\w+$/,"") + "_片段复核.json", JSON.stringify(state, null, 2), "application/json");
$("roster").value = state.roster;
$("roster").oninput = e => { state.roster = e.target.value; save(); renderClips(); renderBoard(); };
renderClips(); renderBoard();
</script>
</body>
</html>
